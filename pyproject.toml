[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gunspec"
version = "0.7.1"
description = "Python SDK for the GunSpec.io firearms specification API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "GunSpec.io" },
]
keywords = ["gunspec", "firearms", "api", "sdk", "specifications", "database"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25,<1",
    "pydantic>=2,<3",
]

[project.urls]
Homepage = "https://gunspec.io"
Documentation = "https://docs.gunspec.io"
Repository = "https://github.com/gunspec/gunspec-python"
Issues = "https://github.com/gunspec/gunspec-python/issues"
Changelog = "https://github.com/gunspec/gunspec-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "mypy>=1.0",
    "ruff>=0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gunspec"]

[tool.hatch.build.targets.sdist]
include = ["src/gunspec", "tests", "scripts", "examples", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.9"
strict = true

[tool.ruff]
target-version = "py39"
line-length = 110
src = ["src", "tests", "scripts", "examples"]
# Generated from the API source; kept byte-identical to the generator's output.
exclude = [
    "src/gunspec/types/error_reasons.py",
    "src/gunspec/types/webhook_events.py",
    "src/gunspec/types/vocabulary.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# UP006/UP007 would rewrite Optional[...] to X | None, which pydantic evaluates
# at runtime and which fails on Python 3.9.
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.ruff.lint.isort]
known-first-party = ["gunspec"]
